[functions]
directory = "netlify/functions"

[[headers]]
for = "/*"
[headers.values]
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
from = "/airport/*"
to = "/index.html"
status = 200

[[redirects]]
from = "/waypoint/*"
to = "/index.html"
status = 200

[[redirects]]
from = "/navaid/*"
to = "/index.html"
status = 200

[[redirects]]
from = "/thank-you"
to = "/index.html"
status = 200
